name: Community page browser tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install Zola (same version as deployment)
        run: |
          curl --fail --location --retry 3 https://github.com/getzola/zola/releases/download/v0.17.2/zola-v0.17.2-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/zola.tar.gz"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP"
      - name: Build and test community page
        run: PATH="$RUNNER_TEMP:$PATH" python -m unittest discover -s tests -v
